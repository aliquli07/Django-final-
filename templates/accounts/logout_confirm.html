{% extends 'base.html' %}

{% block title %}Logout{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="bi bi-box-arrow-right auth-icon"></i>
                    <h1 class="h4 mt-3 mb-4">Log out of DevHub?</h1>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-brand w-100 mb-2">Log out</button>
                    </form>
                    <a href="{% url 'articles:article_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
